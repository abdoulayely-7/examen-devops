# ---- Base de données PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/todo_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Actuator — endpoints de monitoring ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# ---- Micrometer — métriques Prometheus ----
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=todo-backend
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}
