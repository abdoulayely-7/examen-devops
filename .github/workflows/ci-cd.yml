name: CI/CD Pipeline - Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1 : CI (Build, Tests & SonarQube Quality Gate)
  # ==========================================
  ci:
    name: CI - Build, Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour l'analyse approfondie de SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure Maven Wrapper is Executable
        run: chmod +x ./mvnw

      - name: Build, Test & SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "Starting Maven clean verify with SonarQube Quality Gate check..."
            ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=examen-devops-back \
              -Dsonar.projectName="Examen DevOps Backend" \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.qualitygate.wait=true
          else
            echo "::warning ::SONAR_TOKEN ou SONAR_HOST_URL non configuré. Exécution de clean verify standard."
            ./mvnw -B clean verify
          fi

  # ==========================================
  # JOB 2 : CD (Docker Build, Push & Deploy EC2)
  # Démarre UNIQUEMENT si le job CI (avec SonarQube) a réussi !
  # ==========================================
  cd:
    name: CD - Build Image & Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Short Git SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops-back:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Deploying application on EC2..."
            cd /opt/myapp

            export APP_TAG="sha-${{ steps.vars.outputs.short_sha }}"

            if grep -q "APP_TAG=" .env 2>/dev/null; then
              sed -i "s/APP_TAG=.*/APP_TAG=sha-${{ steps.vars.outputs.short_sha }}/" .env
            else
              echo "APP_TAG=sha-${{ steps.vars.outputs.short_sha }}" >> .env
            fi

            echo "Pulling latest application image..."
            docker compose pull application

            echo "Restarting application container..."
            docker compose up -d --no-deps application

      - name: Production Health Check
        run: |
          echo "Waiting 20 seconds for Spring Boot initialization..."
          sleep 20
          echo "Checking https://app-lydevtech.duckdns.org/actuator/health..."
          curl -f -k --retry 5 --retry-delay 6 https://app-lydevtech.duckdns.org/actuator/health
          echo "Application is Healthy and Live on Production!"
