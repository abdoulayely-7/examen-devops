name: CD Pipeline - Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Image & Deploy to Production
    # Le CD démarre UNIQUEMENT si le workflow CI a réussi (Quality Gate OK) ou en déclenchement manuel
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Short Git SHA
        id: vars
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short_sha=$(echo $COMMIT_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops-back:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Deploying application on EC2..."
            cd /opt/myapp

            export APP_TAG="sha-${{ steps.vars.outputs.short_sha }}"

            if grep -q "APP_TAG=" .env 2>/dev/null; then
              sed -i "s/APP_TAG=.*/APP_TAG=sha-${{ steps.vars.outputs.short_sha }}/" .env
            else
              echo "APP_TAG=sha-${{ steps.vars.outputs.short_sha }}" >> .env
            fi

            echo "Pulling latest application image..."
            docker compose pull application

            echo "Restarting application container..."
            docker compose up -d --no-deps application

      - name: Production Health Check
        run: |
          echo "Waiting 20 seconds for Spring Boot initialization..."
          sleep 20
          echo "Checking https://app-lydevtech.duckdns.org/actuator/health..."
          curl -f -k --retry 5 --retry-delay 6 https://app-lydevtech.duckdns.org/actuator/health
          echo "Application is Healthy and Live on Production!"
