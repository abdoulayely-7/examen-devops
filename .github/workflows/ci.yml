name: Pipeline CI - Tests et Analyse SonarQube

# Déclencheurs du pipeline d'Intégration Continue (CI)
on:
  # Se déclenche automatiquement lorsqu'une Pull Request est ouverte ou mise à jour vers 'main'
  pull_request:
    branches: [ main ]
  # Se déclenche quand la Pull Request est acceptée et fusionnée (merge) dans la branche 'main'
  push:
    branches: [ main ]
  # Permet de lancer ce workflow manuellement depuis l'interface GitHub si besoin
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilation, Tests Unitaires et SonarQube
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code source depuis GitHub
      - name: Récupérer le code source (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique git (nécessaire pour l'analyse SonarQube)

      # Étape 2 : Installation de Java 21 sur le serveur de build GitHub
      - name: Configurer l'environnement Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven' # Met en cache les dépendances Maven pour accélérer les futurs builds

      # Étape 3 : Donner les droits d'exécution au script Maven Wrapper
      - name: Rendre le script Maven Wrapper exécutable
        run: chmod +x ./mvnw

      # Étape 4 : Compilation, exécution des tests et attente du Quality Gate SonarQube
      - name: Compiler, Tester et Analyser avec SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "Lancement des tests, génération JaCoCo et analyse SonarQube..."
            ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=examen-devops-back \
              -Dsonar.projectName="Examen DevOps Backend" \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
              -Dsonar.coverage.exclusions="**/config/**,**/dto/**,**/domain/**,**/common/**" \
              -Dsonar.qualitygate.wait=true
          else
            echo "::warning ::Variables SONAR_TOKEN ou SONAR_HOST_URL non définies. Exécution simple des tests."
            ./mvnw -B clean verify
          fi
